<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人名片</title>
  <style>
    /* ===== 全局重置 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      /* 让卡片在页面中垂直+水平居中 */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #FFF3E6;          /* 浅暖橙背景，衬托白色卡片 */
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #222;
    }

    /* ===== 卡片主体 ===== */
    .card {
      width: 360px;                        /* 固定宽度 360px */
      background-color: #fff;              /* 白色背景 */
      border-radius: 12px;                 /* 圆角 12px */
      box-shadow: 0 4px 16px rgba(0, 0, 0, .12);  /* 阴影 */
      padding: 24px;                       /* 内边距 24px */
      transition: transform 0.3s ease, box-shadow 0.3s ease;  /* hover 平滑过渡 */
    }

    /* 卡片 hover：轻微上浮 + 阴影加深 */
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(249, 115, 22, .18);
    }

    /* ===== 顶部：姓名 + 专业（左） + 小头像（右） ===== */
    .card-header {
      display: flex;                       /* 姓名与头像横向排列 */
      align-items: center;                 /* 垂直居中对齐 */
      justify-content: space-between;      /* 姓名靠左、头像靠右 */
      gap: 16px;
    }

    /* 小头像：放在卡片右上角，保持圆形 */
    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;                  /* 圆形裁切 */
      object-fit: cover;                   /* 头像不变形，裁切填满 */
      flex-shrink: 0;                      /* 不随 flex 被压缩 */
      border: 3px solid #FFE0C2;           /* 浅珊瑚描边 */
      box-shadow: 0 4px 12px rgba(249, 115, 22, .18);
    }

    .card-header .name {
      font-size: 24px;
      font-weight: 700;                    /* 加粗 */
      line-height: 1.3;
    }

    .card-header .major {
      margin-top: 6px;
      font-size: 13px;
      color: #888;                         /* 灰色小字 */
    }

    /* ===== 中间：自我介绍 ===== */
    .card-main {
      margin: 16px 0;                      /* 与上下区域留出间距 */
      font-size: 14px;
      line-height: 1.6;                    /* 行高 1.6 */
      color: #444;
    }

    /* ===== 底部：联系方式 ===== */
    .card-footer {
      padding-top: 14px;
      border-top: 1px solid #FCE0C4;        /* 浅珊瑚分隔线 */
      display: flex;                       /* flex 横向排列 */
      gap: 20px;                           /* 两项之间的间距 */
      flex-wrap: wrap;                     /* 窄屏时自动换行 */
      font-size: 13px;
    }

    .card-footer .item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #555;
    }

    .card-footer .label {
      color: #999;                         /* “邮箱 / 微信”标签更浅 */
    }

    .card-footer a {
      color: #F97316;                      /* 邮箱可点击，珊瑚色 */
      text-decoration: none;
    }

    .card-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- 整张名片用 article 包裹，内部按 header / main / footer 划分 -->
  <article class="card">

    <!-- 1. 头部：左侧姓名与专业，右侧小头像 -->
    <header class="card-header">
      <div class="card-id">
        <h1 class="name">关一鸣</h1>
        <p class="major">地理信息科学 · 2024级本科</p>
      </div>
      <img class="avatar" src="images/avatar.jpg" alt="个人头像">
    </header>

    <!-- 2. 主体：一句话自我介绍 -->
    <main class="card-main">
      <p>正在学习 Web 前端，努力把每一个页面都做好。</p>
    </main>

    <!-- 3. 底部：联系方式，flex 横向排列 -->
    <footer class="card-footer">
      <span class="item">
        <span class="label">邮箱</span>
        <a href="mailto:gym1212121212@bjfu.edu.cn">gym1212121212@bjfu.edu.cn</a>
      </span>
      <span class="item">
        <span class="label">微信</span>
        <span>gym1212121212</span>
      </span>
    </footer>

  </article>

</body>
</html>
